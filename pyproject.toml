[project]
name = "mm-sim"
version = "0.1.0"
description = "Market-making simulator lab: quotes, noise and informed order flow, P&L decomposition (simulation only)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Nick", email = "119965654+flodesgg@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
mm-sim = "mm_sim.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1.1",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/mm_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: statistical or long tests; excluded from `make check`, run by `make check-all`",
]
